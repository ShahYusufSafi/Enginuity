# Enginuity validation suite — runs on every push and PR.
#
# The solver validation suite (Backend/tests) is a product surface, not
# housekeeping: it is the public receipt that every number Enginuity
# reports is checked against analytical solutions, convergence theory,
# and independent references on every commit. (docs/ARCHITECTURE.md §3.3)

name: validate

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Efrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Efrontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
